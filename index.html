<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>afterlife♡</title>

<script src="/uv/uv.bundle.js"></script>
<script src="/uv/uv.config.js"></script>
<script src="/baremux/index.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

<style>
* { box-sizing: border-box; font-family: Inter, system-ui; }

/* Hide default cursor everywhere */
*, *::before, *::after {
  cursor: none !important;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #0a1628 0%, #0d2a5e 25%, #1a4a8a 50%, #2196c4 75%, #56c8e8 100%);
    overflow: hidden;
}

/* ===== CUSTOM CURSOR ===== */
#cursor {
    position: fixed;
    width: 12px;
    height: 12px;
    background: #00d4ff;
    border-radius: 50%;
    pointer-events: none;
    z-index: 99999;
    transform: translate(-50%, -50%);
    box-shadow:
        0 0 6px #00d4ff,
        0 0 12px #00d4ff,
        0 0 24px #00aaff,
        0 0 40px #0088ff;
    transition: none;
}

/* ===== PARTICLES CANVAS ===== */
#particles-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
}

/* ===== TOP BAR ===== */
.browser-ui {
    height: 96px;
    background: rgba(5, 20, 60, 0.55);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    display: flex;
    flex-direction: column;
    border-bottom: 1px solid rgba(100, 200, 255, 0.18);
    z-index: 10;
    position: relative;
}

/* ===== TABS ===== */
.tabs {
    height: 38px;
    display: flex;
    align-items: center;
    padding: 0 8px;
    gap: 6px;
    overflow-x: auto;
}

.tab {
    height: 28px;
    min-width: 160px;
    max-width: 220px;
    padding: 0 12px;
    border-radius: 8px 8px 0 0;
    background: rgba(0, 80, 160, 0.4);
    color: #99ccff;
    display: flex;
    align-items: center;
    gap: 8px;
}

.tab.active {
    background: rgba(0, 100, 200, 0.6);
    color: #e0f4ff;
}

.tab span {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.tab i { opacity: .6; }
.tab i:hover { opacity: 1; color: #ff6b6b; }

.newtab {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: #88bbdd;
}
.newtab:hover { background: rgba(0,120,200,0.3); }

/* ===== NAV BAR ===== */
.navbar {
    height: 58px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 12px;
}

.navbar button {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: #88ccee;
}
.navbar button:hover {
    background: rgba(0,150,255,0.2);
    color: #00d4ff;
}

/* ===== URL BAR ===== */
.urlbar {
    flex: 1;
    height: 36px;
    background: rgba(0, 30, 80, 0.6);
    border-radius: 18px;
    padding: 0 16px;
    display: flex;
    align-items: center;
    border: 1px solid rgba(0, 180, 255, 0.25);
}

.urlbar input {
    width: 100%;
    height: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: #c8eeff;
    font-size: 14px;
}
.urlbar input::placeholder { color: rgba(130,190,230,0.5); }

/* ===== VIEWPORT ===== */
.viewframe {
    position: absolute;
    top: 96px;
    left: 0;
    width: 100%;
    height: calc(100% - 96px);
    border: none;
    display: none;
    z-index: 5;
}

.viewframe.active { display: block; }

/* ===== NTP ===== */
.ntp {
    position: absolute;
    top: 96px;
    left: 0;
    width: 100%;
    height: calc(100% - 96px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    pointer-events: none;
    z-index: 2;
}

.ntp h1 {
    font-size: clamp(2.5rem, 7vw, 5rem);
    font-weight: 700;
    letter-spacing: 0.06em;
    margin: 0;
    background: linear-gradient(135deg, #ffffff 0%, #a8e6ff 40%, #00d4ff 70%, #0088ff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    filter: drop-shadow(0 0 30px rgba(0, 180, 255, 0.6));
    animation: pulse-glow 3s ease-in-out infinite;
}

.ntp-sub {
    margin-top: 12px;
    font-size: 0.9rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(100, 200, 255, 0.5);
}

@keyframes pulse-glow {
    0%, 100% { filter: drop-shadow(0 0 20px rgba(0, 180, 255, 0.5)); }
    50%       { filter: drop-shadow(0 0 50px rgba(0, 210, 255, 0.9)); }
}
</style>
</head>

<body>

<!-- Custom cursor dot -->
<div id="cursor"></div>

<!-- Particles -->
<canvas id="particles-canvas"></canvas>

<div class="browser-ui">
    <div class="tabs" id="tabs">
        <button class="newtab" id="newtab"><i class="fas fa-plus"></i></button>
    </div>

    <div class="navbar">
        <button id="back"><i class="fas fa-arrow-left"></i></button>
        <button id="forward"><i class="fas fa-arrow-right"></i></button>
        <button id="reload"><i class="fas fa-rotate-right"></i></button>

        <form class="urlbar" id="form">
            <input id="url" placeholder="Search or enter address">
        </form>

        <button id="popout"><i class="fas fa-external-link"></i></button>
    </div>
</div>

<div class="ntp" id="ntp">
    <h1>afterlife♡</h1>
    <div class="ntp-sub">your space to explore</div>
</div>

<script>
/* ===== CURSOR ===== */
const cursorEl = document.getElementById('cursor');
document.addEventListener('mousemove', e => {
    cursorEl.style.left = e.clientX + 'px';
    cursorEl.style.top  = e.clientY + 'px';
});

/* ===== PARTICLES ===== */
(function() {
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');

    let W, H, particles = [];

    function resize() {
        W = canvas.width  = window.innerWidth;
        H = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const COLORS = ['#00d4ff','#56c8e8','#a8e6ff','#0088ff','#4db8ff','#ffffff'];

    class Particle {
        constructor() { this.reset(true); }
        reset(init) {
            this.x  = Math.random() * W;
            this.y  = init ? Math.random() * H : H + 10;
            this.r  = Math.random() * 2.2 + 0.4;
            this.vx = (Math.random() - 0.5) * 0.4;
            this.vy = -(Math.random() * 0.6 + 0.2);
            this.alpha = Math.random() * 0.7 + 0.15;
            this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
            this.twinkleSpeed = Math.random() * 0.02 + 0.005;
            this.twinkleDir   = Math.random() > 0.5 ? 1 : -1;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.alpha += this.twinkleSpeed * this.twinkleDir;
            if (this.alpha > 0.85 || this.alpha < 0.05) this.twinkleDir *= -1;
            if (this.y < -10) this.reset(false);
        }
        draw() {
            ctx.save();
            ctx.globalAlpha = this.alpha;
            ctx.fillStyle = this.color;
            ctx.shadowColor = this.color;
            ctx.shadowBlur = this.r * 4;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    for (let i = 0; i < 180; i++) particles.push(new Particle());

    function loop() {
        ctx.clearRect(0, 0, W, H);
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(loop);
    }
    loop();
})();

/* ===== BROWSER LOGIC ===== */
navigator.serviceWorker?.register("/uv/sw.js");
const connection = new BareMux.BareMuxConnection("/baremux/worker.js");
connection.setTransport("/libcurl/index.mjs", [{ websocket: "wss://wisp.rhw.one/" }]);

const tabsEl    = document.getElementById("tabs");
const newTabBtn = document.getElementById("newtab");
const urlInput  = document.getElementById("url");
const ntp       = document.getElementById("ntp");

let tabs = [], activeId = null, idCounter = 0;

function createTab(url = "") {
    const id = idCounter++;
    const iframe = document.createElement("iframe");
    iframe.className = "viewframe";
    iframe.dataset.id = id;
    iframe.setAttribute("sandbox","allow-scripts allow-same-origin allow-forms allow-modals allow-popups");
    document.body.appendChild(iframe);

    const tabBtn = document.createElement("div");
    tabBtn.className = "tab";
    tabBtn.dataset.id = id;
    tabBtn.innerHTML = `<span>New Tab</span><i class="fas fa-xmark"></i>`;
    tabBtn.addEventListener("click", e => {
        if (e.target.tagName === "I") closeTab(id);
        else activateTab(id);
    });
    tabsEl.insertBefore(tabBtn, newTabBtn);
    tabs.push({ id, iframe, tabBtn, history: [], index: -1 });
    activateTab(id);
    if (url) navigate(url);
}

function activateTab(id) {
    activeId = id;
    tabs.forEach(t => {
        t.iframe.classList.toggle("active", t.id === id);
        t.tabBtn.classList.toggle("active", t.id === id);
    });
    const tab = getTab();
    if (!tab) return;
    if (tab.index >= 0) { urlInput.value = tab.history[tab.index]; ntp.style.display = "none"; }
    else { urlInput.value = ""; ntp.style.display = "flex"; }
}

function closeTab(id) {
    if (tabs.length === 1) return;
    const i = tabs.findIndex(t => t.id === id);
    const tab = tabs[i];
    tab.iframe.remove(); tab.tabBtn.remove(); tabs.splice(i, 1);
    activateTab(tabs[Math.max(0, i - 1)].id);
}

function normalize(input) {
    if (!input.includes(".")) return "https://search.brave.com/search?q=" + encodeURIComponent(input);
    if (!input.startsWith("http")) return "https://" + input;
    return input;
}

function navigate(input, push = true) {
    const tab = getTab();
    if (!tab) return;
    const url = normalize(input);
    if (push) { tab.history = tab.history.slice(0, tab.index + 1); tab.history.push(url); tab.index++; }
    tab.iframe.src = __uv$config.prefix + __uv$config.encodeUrl(url);
    urlInput.value = url;
    ntp.style.display = "none";
    tab.iframe.onload = () => {
        tab.tabBtn.querySelector("span").textContent =
            tab.iframe.contentDocument?.title || new URL(url).hostname;
    };
}

function getTab() { return tabs.find(t => t.id === activeId); }

back.onclick    = () => { const t = getTab(); if (!t || t.index <= 0) return; t.index--; navigate(t.history[t.index], false); };
forward.onclick = () => { const t = getTab(); if (!t || t.index >= t.history.length - 1) return; t.index++; navigate(t.history[t.index], false); };
reload.onclick  = () => { const t = getTab(); if (!t) return; t.iframe.src = t.iframe.src; };
popout.onclick  = () => { const t = getTab(); if (!t) return; window.open(t.iframe.src, "_blank"); };
form.onsubmit   = e => { e.preventDefault(); if (urlInput.value.trim()) navigate(urlInput.value); };
newTabBtn.onclick = () => createTab();

createTab();
</script>

</body>
</html>
