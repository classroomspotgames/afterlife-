<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Afterlife Arcade</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #030b1a;
  min-height: 100vh;
  font-family: 'Segoe UI', Arial, sans-serif;
  color: #cce8ff;
  cursor: none;
  overflow-x: hidden;
}

#home-btn {
  position: fixed;
  top: 14px;
  left: 16px;
  z-index: 9000;
  background: #061428;
  border: 1.5px solid #1a5e9a;
  color: #88ccff;
  padding: 8px 18px;
  border-radius: 9px;
  font-size: 0.92rem;
  font-weight: 700;
  text-decoration: none;
  cursor: none;
  transition: border-color .15s, color .15s, box-shadow .15s;
  letter-spacing: .4px;
}
#home-btn:hover {
  border-color: #00aaff;
  color: #e0f4ff;
  box-shadow: 0 0 10px #00aaff44;
}

#cursor {
  position: fixed;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #00c8ff;
  box-shadow: 0 0 10px 4px #00c8ff, 0 0 24px 8px #0080ff88;
  pointer-events: none;
  z-index: 99999;
  transform: translate(-50%,-50%);
}

#particles {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}

.page {
  position: relative;
  z-index: 1;
  max-width: 1400px;
  margin: 0 auto;
  padding: 32px 24px 60px;
}

h1 {
  text-align: center;
  font-size: 3rem;
  font-weight: 800;
  letter-spacing: 2px;
  color: #e0f4ff;
  text-shadow: 0 0 20px #00aaff88;
  margin-bottom: 32px;
}

.controls {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-bottom: 36px;
  flex-wrap: wrap;
}

.controls input {
  background: #061428;
  border: 1.5px solid #1a5e9a;
  color: #b0d8f5;
  padding: 10px 20px;
  border-radius: 8px;
  font-size: 1rem;
  width: 320px;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}
.controls input:focus {
  border-color: #00aaff;
  box-shadow: 0 0 10px #00aaff55;
}
.controls input::placeholder { color: #3a7aaa; }

.controls select {
  background: #061428;
  border: 1.5px solid #1a5e9a;
  color: #b0d8f5;
  padding: 10px 16px;
  border-radius: 8px;
  font-size: 1rem;
  outline: none;
  cursor: none;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 20px;
}

.card {
  background: #071a32;
  border: 1.5px solid #1a4d7a;
  border-radius: 14px;
  overflow: hidden;
  cursor: none;
  transition: transform .18s, box-shadow .18s, border-color .18s;
  user-select: none;
}
.card:hover {
  transform: translateY(-5px) scale(1.03);
  box-shadow: 0 8px 32px #00aaff44, 0 0 16px #0066cc33;
  border-color: #00aaff;
}

.card img {
  width: 100%;
  aspect-ratio: 16/10;
  object-fit: cover;
  display: block;
  background: #040e1e;
}

.card-title {
  padding: 10px 12px 12px;
  font-size: 0.92rem;
  font-weight: 600;
  color: #cce8ff;
  text-align: center;
  line-height: 1.3;
}

#modal-bg {
  display: none;
  position: fixed;
  inset: 0;
  background: #00050fcc;
  backdrop-filter: blur(6px);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}
#modal-bg.open { display: flex; }

#modal {
  background: linear-gradient(145deg, #071d3a, #040e1e);
  border: 2px solid #0088dd;
  border-radius: 20px;
  padding: 40px 48px;
  text-align: center;
  box-shadow: 0 0 60px #0066ff44;
  max-width: 420px;
  width: 90%;
  position: relative;
  animation: modalIn .25s ease;
}
@keyframes modalIn {
  from { transform: scale(.88); opacity:0; }
  to   { transform: scale(1);   opacity:1; }
}

#modal h2 {
  font-size: 1rem;
  color: #88ccff;
  margin-bottom: 6px;
  letter-spacing: 1px;
  text-transform: uppercase;
}
#modal h3 {
  font-size: 1.6rem;
  font-weight: 800;
  color: #e0f4ff;
  margin-bottom: 6px;
  text-shadow: 0 0 12px #00aaff66;
}
#modal p {
  font-size: 1rem;
  color: #6aabdd;
  margin-bottom: 28px;
}

.modal-btns {
  display: flex;
  gap: 14px;
  justify-content: center;
  flex-wrap: wrap;
}

.btn {
  padding: 12px 28px;
  border: none;
  border-radius: 10px;
  font-size: 1rem;
  font-weight: 700;
  cursor: none;
  transition: transform .15s, box-shadow .15s;
}
.btn:hover { transform: translateY(-2px); }

.btn-play {
  background: linear-gradient(135deg, #0077cc, #0044aa);
  color: #e0f4ff;
  box-shadow: 0 4px 18px #0066ff55;
}
.btn-play:hover { box-shadow: 0 6px 24px #0088ff88; }

.btn-full {
  background: linear-gradient(135deg, #00aaff, #0077dd);
  color: #fff;
  box-shadow: 0 4px 18px #00aaff55;
}
.btn-full:hover { box-shadow: 0 6px 24px #00ccff88; }

.btn-close {
  position: absolute;
  top: 12px; right: 16px;
  background: none;
  border: none;
  color: #3a7aaa;
  font-size: 1.4rem;
  cursor: none;
  padding: 4px 8px;
  transition: color .15s;
}
.btn-close:hover { color: #00aaff; }

#game-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 2000;
  background: #000;
  flex-direction: column;
}
#game-overlay.open { display: flex; }

#game-topbar {
  background: #040e1e;
  border-bottom: 1.5px solid #1a4d7a;
  padding: 10px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
#game-topbar span {
  color: #88ccff;
  font-weight: 700;
  font-size: 1rem;
}
#game-topbar button {
  background: #0a2040;
  border: 1.5px solid #1a5e9a;
  color: #88ccff;
  padding: 6px 18px;
  border-radius: 8px;
  cursor: none;
  font-weight: 600;
  transition: border-color .15s, color .15s;
}
#game-topbar button:hover { border-color: #00aaff; color: #e0f4ff; }

#game-frame {
  flex: 1;
  border: none;
  width: 100%;
}
</style>
</head>

<a id="home-btn" href="https://games67.vercel.app" target="_blank">&#8592; Home</a>
<div id="cursor"></div>
<canvas id="particles"></canvas>

<div class="page">
  <h1>afterlife arcade</h1>
  <div class="controls">
    <input type="text" id="search" placeholder="search here...">
    <select id="sort">
      <option value="az">a - z (default)</option>
      <option value="za">z - a</option>
    </select>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div id="modal-bg">
  <div id="modal">

    <h2>You are playing on</h2>
    <h3>Afterlife</h3>

    <div class="modal-btns">

      <button class="btn btn-full" id="btn-full">&#9974; Fullscreen</button>
    </div>
  </div>
</div>

<div id="game-overlay">
  <div id="game-topbar">
    <span id="game-title-bar">Playing: &mdash;</span>
    <button id="close-game">&#10005; Close</button>
  </div>
  <iframe id="game-frame" allowfullscreen sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-pointer-lock allow-orientation-lock allow-downloads"></iframe>
</div>

// Cursor
const cursor = document.getElementById('cursor');
document.addEventListener('mousemove', function(e) {
  cursor.style.left = e.clientX + 'px';
  cursor.style.top  = e.clientY + 'px';
});

// Particles
(function() {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let W, H, pts = [];
  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);
  for (var i = 0; i < 90; i++) {
    pts.push({
      x: Math.random() * 2000,
      y: Math.random() * 1200,
      r: Math.random() * 2.2 + 0.5,
      dx: (Math.random() - .5) * .3,
      dy: (Math.random() - .5) * .3,
      a: Math.random() * .7 + .2
    });
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (var j = 0; j < pts.length; j++) {
      var p = pts[j];
      ctx.beginPath();
      ctx.arc(p.x % W, p.y % H, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(100,200,255,' + p.a + ')';
      ctx.fill();
      p.x += p.dx; p.y += p.dy;
      if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

// Render
var grid = document.getElementById('grid');
var search = document.getElementById('search');
var sortSel = document.getElementById('sort');
var NO_IMG = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22125%22%3E%3Crect fill=%22%230a1e3d%22 width=%22200%22 height=%22125%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%2344aaff%22 font-size=%2214%22%3ENo Image%3C%2Ftext%3E%3C%2Fsvg%3E';

function render() {
  var q = search.value.toLowerCase();
  var list = GAMES.filter(function(g){ return g.name.toLowerCase().indexOf(q) !== -1; });
  if (sortSel.value === 'az') list.sort(function(a,b){ return a.name.localeCompare(b.name); });
  else list.sort(function(a,b){ return b.name.localeCompare(a.name); });
  grid.innerHTML = '';
  list.forEach(function(g) {
    var card = document.createElement('div');
    card.className = 'card';
    var img = document.createElement('img');
    img.src = g.img || NO_IMG;
    img.alt = g.name;
    img.loading = 'lazy';
    img.onerror = function(){ this.src = NO_IMG; };
    var title = document.createElement('div');
    title.className = 'card-title';
    title.textContent = g.name;
    card.appendChild(img);
    card.appendChild(title);
    card.addEventListener('click', function(){ openModal(g); });
    grid.appendChild(card);
  });
}
render();
search.addEventListener('input', render);
sortSel.addEventListener('change', render);

// Modal
var activeGame = null;
var modalBg = document.getElementById('modal-bg');
var modalName = document.getElementById('modal-game-name');

function openModal(g) {
  activeGame = g;
  modalName.textContent = g.name;
  modalBg.classList.add('open');
}

document.getElementById('modal-close').addEventListener('click', function(){
  modalBg.classList.remove('open');
});
modalBg.addEventListener('click', function(e){
  if (e.target === modalBg) modalBg.classList.remove('open');
});

document.getElementById('btn-site').addEventListener('click', function(){
  if (!activeGame) return;
  modalBg.classList.remove('open');
  var blob = new Blob([activeGame.html], {type:'text/html'});
  var url = URL.createObjectURL(blob);
  document.getElementById('game-title-bar').textContent = 'Playing: ' + activeGame.name;
  var frame = document.getElementById('game-frame');
  frame.src = url;
  document.getElementById('game-overlay').classList.add('open');

  frame.onload = function() {
    try {
      var iwin = frame.contentWindow;
      var frect = frame.getBoundingClientRect();
      window.addEventListener('resize', function(){ frect = frame.getBoundingClientRect(); });
      iwin.addEventListener('mousemove', function(e) {
        cursor.style.left = (frect.left + e.clientX) + 'px';
        cursor.style.top  = (frect.top  + e.clientY) + 'px';
      });
      var style = iwin.document.createElement('style');
      style.textContent = '*, *::before, *::after { cursor: none !important; }';
      iwin.document.head.appendChild(style);
    } catch(e) {}
  };
});

document.getElementById('btn-full').addEventListener('click', function(){
  if (!activeGame) return;
  modalBg.classList.remove('open');
  var w = window.open('about:blank', '_blank');
  if (w) {
    w.document.open();
    w.document.write(activeGame.html);
    w.document.close();
  }
});

document.getElementById('close-game').addEventListener('click', function(){
  document.getElementById('game-overlay').classList.remove('open');
  document.getElementById('game-frame').src = '';
});
</script>
